# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-yaml
      args: ['--unsafe']
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/pycqa/isort
  rev: 8.0.1
  hooks:
    - id: isort
      name: isort (python)
- repo: https://github.com/psf/black
  rev: 26.3.1
  hooks:
    - id: black
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: "v0.16.0"
  hooks:
    - id: ruff
      name: ruff (lint)
    - id: ruff
      name: ruff (docstrings)
      args: [--select=D1, --ignore=D100]
      files: ^src/
- repo: https://github.com/crate-ci/typos
  rev: v1
  hooks:
    - id: typos
- repo: local
  hooks:
    - id: pytest-check
      name: pytest-check
      entry: uv run --python 3.13 --all-extras pytest test
      language: system
      pass_filenames: false
      always_run: true
    - id: pyright-check
      name: pyright-check
      entry: uv run --python 3.13 --all-extras pyright src
      language: system
      pass_filenames: false
      always_run: true
